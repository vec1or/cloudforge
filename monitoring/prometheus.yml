global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "flask-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.43.60.214:5000"]
        labels:
          environment: "cloudforge"
          namespace: "devops-helm"